services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./providers:/opt/keycloak/providers
      - ./config:/opt/keycloak/config:ro
